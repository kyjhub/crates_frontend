# 프론트 검사 → S3 배포 → CloudFront 캐시 무효화
#
#   PR            lint + build
#   main에 push   lint + build → S3 업로드 → CloudFront 무효화
#
# 무중단: 해시가 붙은 파일(assets/)을 먼저 올리고 index.html을 마지막에 바꾼다. 옛 assets는 지우지 않는다 —
# 배포 직전에 페이지를 연 사용자가 옛 index.html로 옛 청크를 받으러 와도 있게. 파일명이 내용 해시라 쌓여도 작다.
#
# AWS 키는 저장하지 않는다. OIDC로 배포 역할(백엔드 저장소 infra/terraform/prod/github_oidc.tf)을 받는데,
# 그 역할은 이 저장소의 main 브랜치만 믿는다. PR(포크 포함)은 AWS에 닿지 못한다.
# 저장소 변수(Settings → Secrets and variables → Actions → Variables), 값은 백엔드 저장소 infra/terraform/prod에서
#   AWS_FRONTEND_DEPLOY_ROLE_ARN   terraform output -raw github_frontend_deploy_role_arn
#   FRONTEND_BUCKET                terraform output -raw frontend_bucket
#   CLOUDFRONT_DISTRIBUTION_ID     terraform output -raw cloudfront_distribution_id
name: frontend

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # 운영은 .env.production 없이 빌드한다. VITE_AUTH_ORIGIN이 비면 소셜 로그인이 같은 오리진(CloudFront → backend)으로 간다.
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 1) 내용 해시가 이름에 들어간 파일: 한 번 받으면 바뀌지 않으므로 1년 캐시. 옛 파일은 지우지 않는다(위 설명).
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"

      # 2) 그 밖의 파일(index.html, favicon 등): 매번 CloudFront·브라우저가 새로 확인하게 한다.
      #    index.html이 마지막에 바뀌므로, 바뀐 순간에는 새 assets가 이미 올라가 있다.
      - name: Upload entry files
        run: |
          aws s3 sync dist "s3://$BUCKET" --only-show-errors --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          # 끝날 때까지 기다리지 않는다(배포 역할에 조회 권한이 없다). 보통 1분 안에 전 엣지에 퍼진다.
          ID="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)"
          echo "무효화 요청: $ID"
